name: Test gcloud setup with project_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Set up gcloud with project_id (skip_install)
        uses: .
        continue-on-error: true
        with:
          skip_install: 'true'
          project_id: 'my-test-project-12345'

      - name: Assert action ran (succeeded or failed gracefully without gcloud)
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded - gcloud was available and project was set
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with version '$VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed - likely because gcloud is not installed (skip_install=true)
            # and setProject could not run. This is acceptable in the act environment.
            echo "PASS: action failed gracefully (gcloud not available with skip_install=true)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify project configuration if gcloud is available
        if: steps.setup.outcome == 'success'
        run: |
          if command -v gcloud > /dev/null 2>&1; then
            PROJECT="$(gcloud config get-value project 2>/dev/null)"
            echo "configured project: $PROJECT"
            if [ "$PROJECT" != "my-test-project-12345" ]; then
              echo "FAIL: expected project 'my-test-project-12345', got '$PROJECT'"
              exit 1
            fi
            echo "PASS: project correctly set to '$PROJECT'"
          else
            echo "INFO: gcloud not on PATH, skipping project verification"
          fi
