name: Test gcloud setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: '416.0.0'
      - name: Assert version output matches requested version
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ "$VERSION" != "416.0.0" ]; then
            echo "FAIL: expected version '416.0.0' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version output is '$VERSION'"
      - name: Assert gcloud is on PATH
        run: |
          if ! command -v gcloud >/dev/null 2>&1; then
            echo "FAIL: gcloud not found on PATH"
            exit 1
          fi
          echo "PASS: gcloud found at $(command -v gcloud)"
      - name: Assert gcloud version matches
        run: |
          INSTALLED=$(gcloud --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "416.0.0" ]; then
            echo "FAIL: expected gcloud 416.0.0 but got $INSTALLED"
            exit 1
          fi
          echo "PASS: gcloud version matches"
