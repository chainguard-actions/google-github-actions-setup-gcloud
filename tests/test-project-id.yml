name: Test setup-gcloud with project_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: 'latest'
          project_id: 'my-test-project'
      - name: Assert gcloud is installed
        run: |
          echo "Checking gcloud is available in PATH..."
          which gcloud || { echo "FAIL: gcloud not found in PATH"; exit 1; }
          echo "PASS: gcloud found"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert gcloud project is configured
        run: |
          PROJECT=$(gcloud config get-value project 2>/dev/null || true)
          echo "configured project: $PROJECT"
          if [ "$PROJECT" != "my-test-project" ]; then
            echo "FAIL: expected project 'my-test-project', got '$PROJECT'"
            exit 1
          fi
          echo "PASS: project is correctly set to '$PROJECT'"
