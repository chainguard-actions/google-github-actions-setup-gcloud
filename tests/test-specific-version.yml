name: Test gcloud setup with specific version (skip_install)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Set up gcloud with specific version and skip_install
        uses: .
        with:
          skip_install: 'true'
          version: '416.0.0'

      - name: Assert version output matches input
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$VERSION'"

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with skip_install=true and specific version"
