name: Test setup-gcloud with install_components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: 'latest'
          install_components: 'alpha'
      - name: Assert gcloud is installed
        run: |
          echo "Checking gcloud is available in PATH..."
          which gcloud || { echo "FAIL: gcloud not found in PATH"; exit 1; }
          echo "PASS: gcloud found"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert alpha component is installed
        run: |
          echo "Checking gcloud alpha component is available..."
          gcloud components list --filter="id=alpha AND state.name=Installed" --format="value(id)" 2>/dev/null | grep -q "alpha" || {
            echo "FAIL: alpha component not found as installed"
            exit 1
          }
          echo "PASS: alpha component is installed"
