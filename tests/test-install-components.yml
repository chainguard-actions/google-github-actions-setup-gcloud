name: Test install_components input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-gcloud
        uses: .
        with:
          version: 'latest'
          install_components: 'alpha'
      - name: Assert gcloud version output is set
        env:
          VERSION: ${{ steps.setup-gcloud.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version is $VERSION"
      - name: Assert gcloud is on PATH
        run: |
          if ! command -v gcloud >/dev/null 2>&1; then
            echo "FAIL: gcloud not found on PATH"
            exit 1
          fi
          echo "PASS: gcloud found at $(command -v gcloud)"
      - name: Assert alpha component is installed
        run: |
          if ! gcloud alpha --help >/dev/null 2>&1; then
            echo "FAIL: gcloud alpha component not available"
            exit 1
          fi
          echo "PASS: gcloud alpha component is available"
