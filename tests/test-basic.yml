name: Test basic setup-gcloud usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: 'latest'
      - name: Assert gcloud is installed
        run: |
          echo "Checking gcloud is available in PATH..."
          which gcloud || { echo "FAIL: gcloud not found in PATH"; exit 1; }
          echo "PASS: gcloud found"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert gcloud version command works
        run: |
          gcloud version
          echo "PASS: gcloud version command succeeded"
