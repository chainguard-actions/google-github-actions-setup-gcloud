name: Test install_components input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'latest'
          install_components: 'alpha'
      - name: Assert gcloud version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version is '$VERSION'"
      - name: Assert gcloud alpha component is available
        run: |
          if ! gcloud alpha --help > /dev/null 2>&1; then
            echo "FAIL: gcloud alpha component not found"
            exit 1
          fi
          echo "PASS: gcloud alpha component is available"
