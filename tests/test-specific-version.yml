name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: '416.0.0'
          skip_tool_cache: 'true'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$VERSION'"
      - name: Assert gcloud is on PATH
        run: |
          if ! command -v gcloud &>/dev/null; then
            echo "FAIL: gcloud not found on PATH"
            exit 1
          fi
          echo "PASS: gcloud found at $(command -v gcloud)"
      - name: Assert installed version matches requested
        env:
          EXPECTED: '416.0.0'
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "expected: $EXPECTED"
          echo "actual version output: $VERSION"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: installed version matches requested version"
