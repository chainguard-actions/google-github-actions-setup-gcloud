name: Test setup-gcloud with install_components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: 'latest'
          install_components: 'alpha'
      - name: Assert gcloud is available
        run: |
          which gcloud
          echo "gcloud found at: $(which gcloud)"
          echo "PASS: gcloud is in PATH"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert alpha component is installed
        run: |
          gcloud components list --filter="id=alpha AND state.name=Installed" --format="value(id)" 2>/dev/null | grep -q "alpha" && echo "PASS: alpha component is installed" || { echo "FAIL: alpha component not found in installed components"; exit 1; }
